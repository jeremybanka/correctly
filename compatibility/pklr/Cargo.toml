[package]
name = "correctly-pklr"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
glob = "0.3"
pklr = { path = "../../artifacts/pklr-source", default-features = false, features = [
	"eval-core",
	"package-zip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
