name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Review Schemars release and reproduce pinned compatibility eras
        env:
          SCHEMARS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run test:schemars
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run build:vsix
      - name: Check bundled distribution
        run: pnpm run test:distribution
