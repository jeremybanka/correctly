[package]
name = "correctly-schemars-contract"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
schemars = { version = "=0.8.21", features = ["chrono", "uuid08", "uuid1", "url", "arrayvec05", "arrayvec07", "bigdecimal03", "bigdecimal04", "bytes", "either", "enumset", "indexmap1", "indexmap2", "rust_decimal", "semver", "smallvec", "smol_str", "raw_value", "preserve_order", "impl_json_schema"] }
serde_json = "1"
chrono = "0.4"
uuid08 = { package = "uuid", version = "0.8" }
uuid1 = { package = "uuid", version = "1" }
url = "2"
arrayvec05 = { package = "arrayvec", version = "0.5" }
arrayvec07 = { package = "arrayvec", version = "0.7" }
bigdecimal03 = { package = "bigdecimal", version = "0.3" }
bigdecimal04 = { package = "bigdecimal", version = "0.4" }
bytes = "1"
either = "1"
enumset = "1"
indexmap1 = { package = "indexmap", version = "1" }
indexmap2 = { package = "indexmap", version = "2" }
rust_decimal = "1"
semver = "1"
smallvec = "1"
