packages:
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": false
  dprint: true
  keytar: false

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Consumed jeremybanka packages are exempt at every version.
  # Keep aligned with the npm rule in renovate.json.
  - breakage
  - "@breakage/*"
  - comline
  - takua
  - treetrunks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - tsrs
  - "@tsrs/*"

verifyDepsBeforeRun: error

peerDependencyRules:
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
